# Layout Generator Metadata — PFS2 Chronicle Properties
#
# Run against the chronicle PDFs under:
#   modules/pfs-chronicle-generator/assets/chronicles/
#
# Rules are tested in order; the first matching pattern wins.
# Templates support regex capture group substitution: $0 (full match),
# $1, $2, etc.  Use ${~N} to CamelCase-split group N into words.
#
# All season patterns are anchored to pfs2/ to avoid matching SFS
# chronicles that use the same N-XX-Name format.

layouts_dir = "modules/pfs-chronicle-generator/assets/layouts"
chronicles_dir = "modules/pfs-chronicle-generator/assets/chronicles"

# =========================================================================
# Intros
# =========================================================================
# Standalone introductory modules (Intro #1, Intro #2, etc.) use the
# same chronicle layout as Season 5+.

[[rules]]
pattern = 'pfs2/intros/I(\d+)-(\S+)Chronicle\.pdf$'
id = "pfs2.i$1"
parent = "pfs2.intro-layout-i1"
description = "Intro $1 ${~2}"
default_chronicle_location = "modules/pfs-chronicle-generator/assets/chronicles/pfs2/intros/I$1-$2Chronicle.pdf"

# =========================================================================
# Bounties
# =========================================================================
# B1–B12 use bounty-layout-b1, B13+ use bounty-layout-b13.

[[rules]]
pattern = 'pfs2/bounties/B(1[0-2]|[1-9])-(\S+)Chronicle\.pdf$'
id = "pfs2.b$1"
parent = "pfs2.bounty-layout-b1"
description = "B$1 ${~2}"
default_chronicle_location = "modules/pfs-chronicle-generator/assets/chronicles/pfs2/bounties/B$1-$2Chronicle.pdf"

[[rules]]
pattern = 'pfs2/bounties/B(\d+)-(\S+)Chronicle\.pdf$'
id = "pfs2.b$1"
parent = "pfs2.bounty-layout-b13"
description = "B$1 ${~2}"
default_chronicle_location = "modules/pfs-chronicle-generator/assets/chronicles/pfs2/bounties/B$1-$2Chronicle.pdf"

# =========================================================================
# Quests
# =========================================================================
# Q1–Q13 use season-2-style layouts; the summary/boons divider shifts
# between groups.  Q14+ use a different series layout (quest-layout-q14).
#
# Group 1: Q1, Q3, Q4, Q6, Q7, Q8, Q9
# Group 2: Q2
# Group 3: Q5
# Group 4: Q10, Q11, Q13

[[rules]]
pattern = 'pfs2/quests/Q([1346789])-(\S+)Chronicle\.pdf$'
id = "pfs2.q$1"
parent = "pfs2.quest-layout-q1"
description = "Q$1 ${~2}"
default_chronicle_location = "modules/pfs-chronicle-generator/assets/chronicles/pfs2/quests/Q$1-$2Chronicle.pdf"

[[rules]]
pattern = 'pfs2/quests/Q(2)-(\S+)Chronicle\.pdf$'
id = "pfs2.q$1"
parent = "pfs2.quest-layout-q2"
description = "Q$1 ${~2}"
default_chronicle_location = "modules/pfs-chronicle-generator/assets/chronicles/pfs2/quests/Q$1-$2Chronicle.pdf"

[[rules]]
pattern = 'pfs2/quests/Q(5)-(\S+)Chronicle\.pdf$'
id = "pfs2.q$1"
parent = "pfs2.quest-layout-q5"
description = "Q$1 ${~2}"
default_chronicle_location = "modules/pfs-chronicle-generator/assets/chronicles/pfs2/quests/Q$1-$2Chronicle.pdf"

[[rules]]
pattern = 'pfs2/quests/Q(1[013])-(\S+)Chronicle\.pdf$'
id = "pfs2.q$1"
parent = "pfs2.quest-layout-q10"
description = "Q$1 ${~2}"
default_chronicle_location = "modules/pfs-chronicle-generator/assets/chronicles/pfs2/quests/Q$1-$2Chronicle.pdf"

# Catch-all for Q14+

[[rules]]
pattern = 'pfs2/quests/Q(\d+)-(\S+)Chronicle\.pdf$'
id = "pfs2.q$1"
parent = "pfs2.quest-layout-q14"
description = "Q$1 ${~2}"
default_chronicle_location = "modules/pfs-chronicle-generator/assets/chronicles/pfs2/quests/Q$1-$2Chronicle.pdf"

