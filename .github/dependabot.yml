version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      pip-minor-patch:
        update-types:
          - minor
          - patch
        patterns:
          - "*"
      # Security updates aren't taken by the version-update group above; group them too.
      security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"
